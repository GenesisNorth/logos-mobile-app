name: logos_mobile_app
description: "LOGOS IN ME — Strictly Scripture-centered mobile application (MVP v3)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  google_fonts: ^6.2.1
  audioplayers: ^6.0.0
  record: ^5.1.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  flutter_animate: ^4.5.0
  path_provider: ^2.1.4
  http: ^1.2.2
  speech_to_text: ^7.5.0
  share_plus: ^13.3.1
  video_player: ^2.14.1
  crypto: ^3.0.7
  hugeicons: ^4.4.0
  supabase_flutter: ^2.18.3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_tts: ^4.2.5
  flutter_timezone: ^5.1.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/google_fonts/



dependency_overrides:
  record_platform_interface: 1.1.0

# App icon — run: dart run flutter_launcher_icons
# (artwork from tool/make_brand_assets.py; replace with final designer files)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

# Launch screen — run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash_mark.png
  color_dark: "#0F0B1C"
  image_dark: assets/branding/splash_mark.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/app_icon_foreground.png
    icon_background_color: "#7C3AED"
    color_dark: "#0F0B1C"
    image_dark: assets/branding/app_icon_foreground.png
    icon_background_color_dark: "#7C3AED"
