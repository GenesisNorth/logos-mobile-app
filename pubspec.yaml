name: logos_mobile_app
description: "LOGOS IN ME — Strictly Scripture-centered mobile application (MVP v3)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  google_fonts: ^6.2.1
  audioplayers: ^6.0.0
  record: ^5.1.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  flutter_animate: ^4.5.0
  path_provider: ^2.1.4
  http: ^1.2.2
  speech_to_text: ^7.5.0
  share_plus: ^13.3.1
  video_player: ^2.14.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/



dependency_overrides:
  record_platform_interface: 1.1.0
